name: DevPet checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix vscode-extension
      - run: npm test --prefix vscode-extension
      - name: Build and inspect the extension archive
        working-directory: vscode-extension
        run: |
          npm run package -- --out "${{ runner.temp }}/devpet.vsix"
          python3 scripts/check-vsix.py "${{ runner.temp }}/devpet.vsix"
